# PostgreSQL para desarrollo local.
# Uso: docker compose up -d
# El puerto del host es 5434 por defecto (se puede cambiar con POSTGRES_PORT).
services:
  db:
    image: postgres:16-alpine
    container_name: foodstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - foodstore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  foodstore-data:
